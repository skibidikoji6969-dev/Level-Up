[package]
name = "progress-os"
version = "1.0.0"
description = "PROGRESS//OS — offline personal progress tracking desktop app"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

# See https://tauri.app/v1/api/config/#buildconfig for more info
[lib]
name = "progress_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
